<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon/Shield -->
  <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="#050816" stroke="url(#grad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Cyber Code Brackets -->
  <path d="M 36 36 L 24 50 L 36 64" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 64 36 L 76 50 L 64 64" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central 'P' Initial -->
  <text x="50" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="url(#grad)" text-anchor="middle">P</text>
</svg>
